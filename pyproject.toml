[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-voice-transcriber"
version = "0.1.0"
description = "Discord bot for transcribing voice calls in D&D sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.0.0",
    "python-dotenv",
    "faster-whisper",
    "pydub",
    "pyaudio",
    "transformers",
    "torch",
    "datasets",
    "accelerate"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools]
packages = ["src"]