[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-voice-transcriber"
version = "0.1.0"
description = "Discord bot for transcribing voice calls in D&D sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "py-cord[voice]==2.8.0rc2",
    "python-dotenv",
    "faster-whisper",
    "pydub",
    "pyaudio",
    "chromadb",
    "transformers",
    "torch",
    "einops",
    "datasets",
    "accelerate"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools]
packages = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]
ignore = ["E203","F401"]
exclude = ['.git', '__pycache__', 'venv', '.venv']
