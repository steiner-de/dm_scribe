[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-voice-transcriber"
version = "0.1.0"
description = "Discord bot for transcribing voice calls in D&D sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "faster-whisper",
    "pydub",
    "transformers",
    "torch",
    "datasets",
    "accelerate",
    "pynacl==1.6.2",
    "py-cord==2.7.2",
    "davey==0.1.5",
    "requests>=2.34.2",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]
# Only needed to run train_llm.py / package_for_ollama.py, not the bot itself.
# Requires a CUDA GPU; see DND_LLM_GUIDE.md.
train = [
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "trl>=0.9",
]

[tool.setuptools]
packages = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]
ignore = ["E203","F401"]
exclude = ['.git', '__pycache__', 'venv', '.venv']
